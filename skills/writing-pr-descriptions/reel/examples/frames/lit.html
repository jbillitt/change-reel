<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<template>
<style>
  #root { position: absolute; inset: 0; overflow: hidden; background: #1a120c; }
  .lt-kicker { position: absolute; left: 96px; top: 84px; font: 500 24px/1 "Work Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #e8c79a; }
  .lt-title { position: absolute; left: 90px; top: 124px; font: 500 76px/1 "Fraunces", Georgia, serif; color: #f4ead8; }
  .lt-title em { color: #f2c230; }
  .lt-note { padding: 10px 16px; border-left: 4px solid #f2c230; background: rgba(30, 20, 12, .84); color: #f4ead8; white-space: nowrap;
    font: 600 24px/1.2 "Work Sans", sans-serif; }
  .lt-note code { font: 500 22px/1 "JetBrains Mono", monospace; color: #f2c230; }
</style>
<div id="root" class="f-lit" data-composition-id="lit" data-width="1920" data-height="1080">
  <div class="lt-kicker">resize &middot; flag on</div>
  <div class="lt-title">A new <em>slot</em> on the desk</div>
  <div class="lt-note lt-flag"><code>isRustResizeOn</code> turned on</div>
</div>
<script>
(function () {
  // A lit 3D world frame: see "Lit 3D world frames" in SKILL.md. The whole 3D state is draw(t); LIT.drive runs it.
  var root = document.querySelector('.f-lit'), q = function (s) { return root.querySelector(s); };
  var F = window.__REEL.lit, T = window.THREE_MODERN, tl = gsap.timeline({ paused: true }), S = 'power3.out';
  var st = LIT.stage(root, { background: '#1a120c', fog: ['#1a120c', 16, 34], env: 0.4, camera: { fov: 30, pos: [0, 7, 15], look: [0, 0.4, 0] } });
  LIT.rig(st, { key: { pos: [3, 11, 7], target: [0, 0, 0.5] } });

  var label = function (text, w, h, bg, fg, font) {
    return LIT.texture(function (ctx, r, W, H) {
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = fg; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, W / 2, H / 2 + 4);
    }, w, h, {}, st);
  };
  var add = function (geo, m, pos, parent) {
    var o = new T.Mesh(geo, m); o.position.fromArray(pos); o.castShadow = o.receiveShadow = true; (parent || st.scene).add(o); return o;
  };

  // The desk: lacquered wood with seeded grain, so every render draws the same grain.
  var wood = LIT.texture(function (ctx, r, w, h) {
    ctx.fillStyle = '#6b4630'; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 110; i++) {
      var y = r() * h, a = r() * 6;
      ctx.strokeStyle = 'rgba(28,14,6,' + (0.03 + r() * 0.07).toFixed(3) + ')'; ctx.lineWidth = 2 + r() * 7;
      ctx.beginPath(); ctx.moveTo(0, y); for (var x = 0; x <= w; x += 48) ctx.lineTo(x, y + Math.sin(x / 170 + i) * a); ctx.stroke();
    }
  }, 1024, 512, { seed: 'desk' }, st);
  add(new T.BoxGeometry(20, 0.5, 10), LIT.mat.lacquer(0xffffff, { map: wood, clearcoat: 0.6 }), [0, -0.25, 0]);

  // Two open trays: the old one in plain wood, the new one in brass. Labels are canvas textures, so they take the light.
  var tray = function (x, m, name, plate) {
    var g = new T.Group(); g.position.set(x, 0, 0); st.scene.add(g);
    add(new T.BoxGeometry(3.4, 0.08, 2.4), m, [0, 0.04, 0], g);
    [[0, 0.3, 1.16, 3.4, 0.6, 0.08], [0, 0.3, -1.16, 3.4, 0.6, 0.08], [1.66, 0.3, 0, 0.08, 0.6, 2.4], [-1.66, 0.3, 0, 0.08, 0.6, 2.4]]
      .forEach(function (b) { add(new T.BoxGeometry(b[3], b[4], b[5]), m, [b[0], b[1], b[2]], g); });
    var p = new T.Mesh(new T.PlaneGeometry(2.4, 0.42), LIT.mat.matte(0xffffff, { map: label(name, 640, 112, plate, '#2b1c12', '600 64px "Work Sans", sans-serif') }));
    p.position.set(0, 0.32, 1.205); g.add(p);
    return g;
  };
  tray(-2.4, LIT.mat.lacquer(0x5a3b26, { roughness: 0.6 }), 'media-bff', '#e9dcc4');
  var brass = tray(2.4, LIT.mat.metal(0xc9a24a), 'rust-resizer', '#f2c230');

  // The letter, and the forwarding sticker that slaps onto it.
  var env = LIT.texture(function (ctx, r, w, h) {
    ctx.fillStyle = '#fbf6ea'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#c9b79a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(w / 2, h * 0.55); ctx.lineTo(w - 10, 10); ctx.stroke();
    ctx.fillStyle = '#d63a2e'; ctx.fillRect(w - 150, 26, 110, 128);
    ctx.fillStyle = '#2b1c12'; ctx.font = '700 64px "Work Sans", sans-serif'; ctx.fillText('RESIZE', 50, h - 80);
    ctx.font = '500 40px "Work Sans", sans-serif'; ctx.fillText('image 4021', 50, h - 30);
  }, 640, 416, {}, st);
  var paper = LIT.mat.matte(0xfbf6ea);
  var letter = new T.Group(); st.scene.add(letter);
  add(new T.BoxGeometry(2.0, 0.04, 1.3), [paper, paper, LIT.mat.matte(0xffffff, { map: env }), paper, paper, paper], [0, 0, 0], letter);
  var sticker = new T.Mesh(new T.PlaneGeometry(1.1, 0.42), LIT.mat.lacquer(0xffffff, { map: label('rust-resizer', 520, 200, '#f2c230', '#2b1c12', '700 60px "Work Sans", sans-serif') }));
  sticker.rotation.set(-Math.PI / 2, 0, 0.12); sticker.position.set(-0.3, 0.03, 0.15); letter.add(sticker);

  // The flag: a brass toggle on the desk edge. A setting, not a character: it only moves.
  var lever = new T.Group(); lever.position.set(-4.4, 0, 3.0); lever.scale.setScalar(1.4); st.scene.add(lever);
  add(new T.CylinderGeometry(0.42, 0.5, 0.22, 40), LIT.mat.metal(0x3a3a40, { roughness: 0.35 }), [0, 0.11, 0], lever);
  var arm = new T.Group(); arm.position.y = 0.22; lever.add(arm);
  add(new T.CylinderGeometry(0.05, 0.06, 1.1, 20), LIT.mat.metal(0xc9a24a), [0, 0.55, 0], arm);
  add(new T.SphereGeometry(0.14, 32, 16), LIT.mat.lacquer(0xd63a2e), [0, 1.12, 0], arm);
  // Pinned just right of where the knob rests once the flag is on.
  LIT.anchor(st, q('.lt-flag'), [-3.3, 1.75, 3.0], '28px', '-50%');

  // Cue times, from the words that name each part.
  var cResize = F.cue(0, 'resize'), cFlag = F.cue(0, 'flag'), cSends = F.cue(0, 'sends'), cLand = F.cue(0, 'rust-resizer', true), END = F.end;
  var from = new T.Vector3(-1.2, 0.04, 3.4), to = new T.Vector3(2.4, 0.12, 0), tmp = new T.Vector3();

  function draw(t) {
    var on = LIT.span(t, cFlag, cFlag + 0.45);
    arm.rotation.z = 0.55 - 1.1 * on;
    sticker.scale.setScalar(0.001 + LIT.span(t, cFlag + 0.25, cFlag + 0.55, 'expo.out'));
    var go = LIT.span(t, cSends, cLand, 'power2.inOut');
    tmp.lerpVectors(from, to, go); tmp.y += Math.sin(Math.PI * go) * 1.3;
    letter.position.copy(tmp);
    letter.rotation.set(0, 0.25 - 0.25 * go, Math.sin(Math.PI * go) * 0.12);
    brass.position.y = -0.04 * LIT.span(t, cLand - 0.05, cLand + 0.1) * (1 - LIT.span(t, cLand + 0.1, cLand + 0.5));
    // One camera move for the beat: a slow push in.
    var push = LIT.span(t, 0, END, 'sine.inOut');
    st.camera.position.set(0, 7 - 0.8 * push, 15 - 2.2 * push);
    st.camera.lookAt(0, 0.4, 0);
  }
  LIT.drive(tl, st, draw, F.duration);

  // HTML reveals stay plain tweens: a seek sets them directly.
  tl.fromTo(q('.lt-kicker'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .5, ease: S }, cResize);
  tl.fromTo(q('.lt-title'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .7, ease: S }, .2);
  tl.fromTo(q('.lt-flag'), { opacity: 0 }, { opacity: 1, duration: .35, ease: S }, cFlag + 0.2);
  tl.to({}, { duration: .01 }, F.duration - .01);
  window.__timelines = window.__timelines || {};
  window.__timelines.lit = tl;
})();
</script>
</template>
</body>
</html>
