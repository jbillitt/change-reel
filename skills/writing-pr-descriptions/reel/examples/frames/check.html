<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<template>
<style>
  #root { position: absolute; inset: 0; overflow: hidden; }
  /* Three luggage labels on the felt, each stamped as the voice names it. */
  .ck-wall { position: absolute; inset: 0; background: radial-gradient(1100px 760px at 50% 20%, #7c5233 0%, #3a2417 60%, #1a100a 100%); }
  .ck-felt { position: absolute; left: -100px; right: -100px; top: 330px; height: 900px; transform-origin: 50% 0%; transform: perspective(1500px) rotateX(30deg);
    background: #2f5b55; box-shadow: inset 0 0 120px rgba(0,0,0,.5); border-radius: 30px; }
  .ck-head { position: absolute; left: 96px; top: 84px; color: #f4ead8; }
  .ck-kicker { font: 500 24px/1 "Work Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #e8c79a; }
  .ck-title { margin-top: 16px; font: 500 96px/1 "Fraunces", Georgia, serif; letter-spacing: -.01em; }
  .ck-title span { display: inline-block; }
  .ck-label { position: absolute; top: 420px; width: 500px; height: 330px; transform-origin: 50% 0%; }
  .ck-label svg { position: absolute; inset: 0; filter: drop-shadow(0 22px 24px rgba(0,0,0,.45)); }
  .ck-text { position: absolute; left: 70px; right: 40px; top: 64px; color: #2b1c12; }
  .ck-n { font: 600 22px/1 "Work Sans", sans-serif; letter-spacing: .18em; color: #7a5a3c; }
  .ck-name { margin-top: 14px; font: 500 64px/1 "Fraunces", Georgia, serif; }
  .ck-desc { margin-top: 16px; font: 500 27px/1.3 "Work Sans", sans-serif; color: #4a3626; }
  .ck-stamp { position: absolute; right: 26px; bottom: 26px; padding: 10px 16px; border: 5px solid #2f6b4f; border-radius: 8px; color: #2f6b4f;
    font: 800 30px/1 "Work Sans", sans-serif; letter-spacing: .14em; transform: rotate(-12deg); opacity: 0; mix-blend-mode: multiply; }
  .ck-lamp { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; background: radial-gradient(1300px 700px at 50% 55%, rgba(255,214,160,.7), rgba(255,214,160,0) 70%); }
</style>
<div id="root" class="f-check" data-composition-id="check" data-width="1920" data-height="1080">
  <div class="ck-wall"></div>
  <div class="ck-felt"></div>
  <div class="ck-head"><div class="ck-kicker">Before you approve</div><div class="ck-title"><span>Three</span> <span>things</span> <span>to</span> <span>check</span></div></div>
  <div class="ck-label" data-r="off" style="left:110px;transform:rotate(-3deg)">
    <svg viewBox="0 0 500 330"><path d="M40 0 H500 V330 H40 L0 290 V40 Z" fill="#fbf6ea"/><circle cx="34" cy="165" r="14" fill="#2f5b55"/><circle cx="34" cy="165" r="14" fill="none" stroke="#c9b79a" stroke-width="4"/></svg>
    <div class="ck-text"><div class="ck-n">01</div><div class="ck-name">Flag off</div><div class="ck-desc">Resizes take the old address again</div></div><div class="ck-stamp">CHECKED</div></div>
  <div class="ck-label" data-r="crop" style="left:710px;transform:rotate(2deg)">
    <svg viewBox="0 0 500 330"><path d="M40 0 H500 V330 H40 L0 290 V40 Z" fill="#fbf6ea"/><circle cx="34" cy="165" r="14" fill="#2f5b55"/><circle cx="34" cy="165" r="14" fill="none" stroke="#c9b79a" stroke-width="4"/></svg>
    <div class="ck-text"><div class="ck-n">02</div><div class="ck-name">Crop</div><div class="ck-desc">Still posted to the BFF, unchanged</div></div><div class="ck-stamp">CHECKED</div></div>
  <div class="ck-label" data-r="errors" style="left:1310px;transform:rotate(-1.5deg)">
    <svg viewBox="0 0 500 330"><path d="M40 0 H500 V330 H40 L0 290 V40 Z" fill="#fbf6ea"/><circle cx="34" cy="165" r="14" fill="#2f5b55"/><circle cx="34" cy="165" r="14" fill="none" stroke="#c9b79a" stroke-width="4"/></svg>
    <div class="ck-text"><div class="ck-n">03</div><div class="ck-name">Errors</div><div class="ck-desc">A failed resize still shows a toast</div></div><div class="ck-stamp">CHECKED</div></div>
  <div class="ck-lamp"></div>
</div>
<script>
(function () {
  var root = document.querySelector('.f-check'), q = function (s) { return root.querySelector(s); }, qa = function (s) { return root.querySelectorAll(s); };
  var F = window.__REEL.check, at = F.cue, tl = gsap.timeline({ paused: true }), S = 'power3.out';
  tl.fromTo(q('.ck-kicker'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .5, ease: S }, .05);
  tl.fromTo(qa('.ck-title span'), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .6, ease: S, stagger: .07 }, Math.max(.1, at(0, 'review') - .2));
  // Each label drops onto the felt as it is named; its stamp lands a beat later, on the sound.
  ['off', 'crop', 'errors'].forEach(function (w) {
    var label = q('[data-r="' + w + '"]'), t = at(0, w);
    tl.fromTo(label, { opacity: 0, y: -120, rotationX: -50 }, { opacity: 1, y: 0, rotationX: 0, duration: .6, ease: S }, t - .2);
    tl.fromTo(label.querySelector('.ck-stamp'), { opacity: 0, scale: 2.2 }, { opacity: .92, scale: 1, duration: .2, ease: 'expo.out' }, t + .25);
  });
  tl.to({}, { duration: .01 }, F.duration - .01);
  window.__timelines = window.__timelines || {};
  window.__timelines.check = tl;
})();
</script>
</template>
</body>
</html>
