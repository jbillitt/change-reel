<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The stage is 1920x1080. Built-in scenes lay out at 1280x720 (content in the top 83%, y < 598, captions below)
     on layers scaled 1.5x; frame scenes are full-bleed HyperFrames compositions mounted between those layers.
     A look (look.js) sets the tokens below and draws the cast; this file owns story, timing and motion. */
  :root {
    --stage-bg: #00031f; --frame-bg: #fff; --frame-radius: 26px; --frame-shadow: 0 40px 90px -24px rgba(0,0,0,.8);
    --ink: #141833; --heading: #fff; --muted: #5b6079; --chip-bg: rgba(255,255,255,.1); --chip-ink: rgba(255,255,255,.85);
    --added: #1a7f37; --changed: #b7791f; --removed: #8c959f; --neutral: #3b4bd8; --flag: #d6336c;
    --board-bg: #1d2a23; --board-ink: #f2f0e4; --board-border: 14px solid #5d3f24;
    --code-bg: #0d1235; --code-ink: #c9cdf0; --code-gutter: #6e75a8;
    --cap-bg: rgba(6,9,40,.8); --cap-ink: #fff; --cap-dim: rgba(255,255,255,.42); --cap-radius: 16px;
    --tag-bg: #f1f2f8; --tag-ink: #3a3f5c;
    --display: "Archivo", "Segoe UI", sans-serif; --display-stretch: 70%; --display-weight: 800;
    --body: "Archivo", "Segoe UI", sans-serif; --mono: "JetBrains Mono", Consolas, monospace; --hand: "Caveat", "Ink Free", cursive;
  }
  @font-face { font-family: "Archivo"; src: url("fonts/archivo-wdth.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Caveat"; src: url("fonts/caveat-600.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; background: var(--stage-bg); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--stage-bg); }
  /* Layers, back to front: built-in scenes (1), frames (2), transition effects (3), captions and chapters (4). */
  .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform: scale(1.5); transform-origin: 0 0;
    font-family: var(--body); color: var(--ink); }
  .layer.legacy { z-index: 1; } .layer.top { z-index: 4; pointer-events: none; }
  .fw { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 2; }
  .fw > .m { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #fx { position: absolute; inset: -240px; z-index: 3; pointer-events: none; opacity: 0; }
  /* Built-in scene styles are scoped to the scaled layers: frames and blocks share this page, so a bare .scene or .line
     rule here would restyle them, and theirs would restyle these. */
  @scope (.layer) {
  .ground, .overlay, .hoverlay { position: absolute; inset: 0; }
  .overlay { pointer-events: none; }
  .chapters { position: absolute; right: 72px; top: 34px; display: flex; gap: 6px; }
  .chapters i { display: block; width: 46px; height: 4px; border-radius: 2px; background: var(--chip-bg); overflow: hidden; }
  .chapters b { display: block; height: 100%; width: 100%; background: var(--chip-ink); transform-origin: 0 50%; transform: scaleX(0); }
  .scene { position: absolute; inset: 0 0 122px 0; visibility: hidden; }
  .inner { position: absolute; inset: 0; }
  .scene h2 { position: absolute; left: 72px; top: 26px; margin: 0; color: var(--heading); font: 700 44px/1 var(--display);
    font-stretch: var(--display-stretch); letter-spacing: -.01em; }
  .frame { position: absolute; left: 72px; right: 72px; top: 92px; bottom: 0; border-radius: var(--frame-radius); overflow: hidden;
    background: var(--frame-bg); box-shadow: var(--frame-shadow); }

  .hook { position: absolute; left: 96px; right: 96px; top: 150px; }
  .hook .chip, .card .start { display: inline-flex; gap: 10px; align-items: center; padding: 8px 14px; border-radius: 999px;
    background: var(--chip-bg); color: var(--chip-ink); font: 500 18px/1 var(--mono); }
  .hook .big { margin-top: 26px; color: var(--heading); font: var(--display-weight) 104px/.92 var(--display); font-stretch: var(--display-stretch); letter-spacing: -.02em; }
  .hook .big span, .card .big span, .card .sub span { display: inline-block; margin-right: .24em; }

  .world { position: absolute; inset: 0; transform-origin: 50% 72%; }
  .floor { position: absolute; left: 0; right: 0; bottom: 108px; height: 2px; background: rgba(20,24,51,.12); }
  .spot { position: absolute; left: 0; top: -40px; width: 420px; height: 560px; margin-left: -210px; opacity: 0;
    background: radial-gradient(ellipse at 50% 70%, rgba(255,236,170,.55), rgba(255,236,170,0) 62%); }
  .actor { position: absolute; bottom: 64px; width: 250px; margin-left: -125px; text-align: center; }
  .actor svg { display: block; margin: 0 auto; overflow: visible; }
  .tag { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 14px; border-radius: 999px;
    background: var(--tag-bg); font: 500 18px/1 var(--mono); color: var(--tag-ink); white-space: nowrap; }
  .tag i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .parcel { position: absolute; padding: 9px 14px; border-radius: 10px; background: var(--ink); color: #fff;
    font: 500 16px/1 var(--mono); white-space: nowrap; box-shadow: 0 10px 22px -10px rgba(20,24,51,.6); opacity: 0; }

  .board { position: absolute; inset: 0; border-radius: var(--frame-radius); border: var(--board-border); background: var(--board-bg); box-sizing: border-box; }
  .chalkline { position: absolute; left: 64px; font: 600 54px/1 var(--hand); color: var(--board-ink); white-space: nowrap;
    clip-path: inset(-10% 100% -10% -2%); }
  .stick { position: absolute; left: 0; top: 0; width: 44px; height: 9px; border-radius: 3px; background: var(--board-ink); opacity: 0; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
  svg.mark { position: absolute; overflow: visible; }

  .codewin { position: absolute; inset: 0; background: var(--code-bg); border-radius: var(--frame-radius); overflow: hidden; }
  .codehead { display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-bottom: 1px solid rgba(255,255,255,.08);
    font: 500 18px/1 var(--mono); color: var(--code-ink); }
  .codehead .path { flex: 1; white-space: nowrap; overflow: hidden; }
  .codehead .stat { padding: 6px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .stat.add { background: rgba(46,160,67,.2); color: #7ee2a0; }
  .stat.del { background: rgba(248,81,73,.18); color: #ff9c95; }
  .codebody { position: relative; font: 500 21px/1.55 var(--mono); }
  .hunk { position: absolute; left: 0; right: 0; top: 18px; }
  .row { display: flex; padding: 0 26px; color: var(--code-ink); opacity: 0; white-space: pre; }
  .row .g { width: 26px; color: var(--code-gutter); flex: none; }
  .row.add { background: rgba(46,160,67,.16); color: #b7f0c4; } .row.add .g { color: #7ee2a0; }
  .row.del { background: rgba(248,81,73,.13); color: #ffc2bd; } .row.del .g { color: #ff9c95; }

  .persona { position: absolute; left: 96px; top: 70px; width: 260px; text-align: center; }
  .avatar { width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; color: #fff; background: var(--neutral);
    font: 800 58px/150px var(--display); font-stretch: 75%; }
  .app { position: absolute; right: 80px; top: 56px; width: 560px; border-radius: 22px; background: #f6f7fb;
    border: 1px solid #e1e4ef; padding: 30px; box-sizing: border-box; color: #141833; }
  .app h3 { margin: 0 0 20px; font: 700 36px/1 var(--display); font-stretch: 80%; }
  .pillwrap { position: relative; height: 40px; }
  .status { position: absolute; left: 0; top: 0; padding: 9px 16px; border-radius: 999px; font: 600 20px/1 var(--body); }
  .status.before { background: #dbe4ff; color: #1f3cff; }
  .status.after { background: #e8eaee; color: #4b5563; opacity: 0; }
  .btn { margin-top: 28px; display: inline-block; padding: 14px 24px; border-radius: 12px; background: #141833; color: #fff; font: 600 21px/1 var(--body); }
  .ripple { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid var(--neutral); opacity: 0; }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; opacity: 0; }
  .toast { position: absolute; right: 80px; top: 22px; padding: 14px 18px; border-radius: 14px; background: #141833; color: #fff;
    font: 600 19px/1 var(--body); opacity: 0; }

  .card { position: absolute; left: 96px; right: 96px; top: 120px; }
  .card .big { color: var(--heading); font: var(--display-weight) 84px/.95 var(--display); font-stretch: var(--display-stretch); letter-spacing: -.02em; max-width: 1060px; }
  .card .sub { margin-top: 22px; color: var(--heading); opacity: .8; font: 500 30px/1.3 var(--body); }
  .card .start { margin-top: 30px; border-radius: 12px; }

  /* Flow: the mechanism, drawn and run. */
  .flow { position: absolute; inset: 0; overflow: visible; }
  .flabel { font: 600 19px/1 var(--mono); fill: var(--ink); text-anchor: middle; }
  .elabel { font: 500 15px/1 var(--mono); fill: var(--ink); text-anchor: middle; opacity: 0; }
  .token rect { fill: var(--ink); } .token text { font: 600 15px/1 var(--mono); fill: var(--token-ink, #fff); text-anchor: middle; }
  .morph { position: absolute; padding: 8px 12px; border-radius: 10px; background: var(--ink);
    color: var(--token-ink, #fff); font: 600 17px/1 var(--mono); white-space: nowrap; opacity: 0; }
  .fnote { position: absolute; font: 600 28px/1 var(--hand); color: var(--ink); white-space: nowrap; opacity: 0; }
  /* Concept: one abstract metaphor, advanced a step per spoken line. */
  .concept { position: absolute; inset: 0; overflow: visible; }
  .clabel { font: 600 20px/1 var(--mono); fill: var(--ink); text-anchor: middle; }
  .cfield { font: 600 19px/1 var(--mono); fill: var(--ink); }
  .curtain { position: absolute; top: 0; bottom: 0; width: 52%; background: repeating-linear-gradient(90deg,#8e1b22 0 26px,#a8262e 26px 52px);
    box-shadow: inset 0 -30px 40px rgba(0,0,0,.35); z-index: 5; }
  .valance { position: absolute; left: 0; right: 0; top: 0; height: 34px; z-index: 6;
    background: radial-gradient(circle at 30px -6px, #a8262e 28px, transparent 29px) 0 0/60px 34px, #7c151b; }
  .boards { position: absolute; left: 0; right: 0; bottom: 0; height: 108px; background: repeating-linear-gradient(90deg,#8a5a34 0 90px,#7a4e2c 90px 92px); }
  .direction { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); font: italic 600 22px/1.2 Georgia, "Times New Roman", serif;
    color: var(--ink); opacity: 0; white-space: nowrap; z-index: 7; }
  .lit .direction { color: #f6e7c4; top: 70px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .book { position: absolute; left: 70px; right: 70px; top: 18px; bottom: 18px; display: flex; perspective: 1600px; }
  .pg { flex: 1; background: #fbf7ee; box-shadow: inset -18px 0 30px -18px rgba(0,0,0,.25); padding: 44px 46px; box-sizing: border-box; position: relative; }
  .pg + .pg { box-shadow: inset 18px 0 30px -18px rgba(0,0,0,.25); }
  .pg p { margin: 0; font: 400 27px/1.45 Georgia, "Times New Roman", serif; color: #2b2118; position: absolute; left: 46px; right: 46px; top: 44px; opacity: 0; }
  .pg p:first-letter { float: left; font-size: 74px; line-height: .9; padding: 6px 10px 0 0; color: #9b2a1c; }
  .pg .moral { position: absolute; left: 46px; right: 46px; top: 44px; font: italic 600 24px/1.4 Georgia, serif; color: #6b4f36; text-align: center; opacity: 0; }
  .cap { position: absolute; left: 72px; right: 72px; bottom: 30px; margin: 0 auto; width: max-content; max-width: 1136px; display: flex; gap: 14px;
    align-items: center; padding: 14px 22px; border-radius: var(--cap-radius); background: var(--cap-bg); opacity: 0; }
  .cap .who { flex: none; padding: 6px 10px; border-radius: 8px; color: #fff; font: 600 16px/1 var(--mono); }
  .cap .line { color: var(--cap-dim); font: 600 25px/1.22 var(--body); font-stretch: 92%; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="chalk" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" result="d"/>
    <feComponentTransfer in="n" result="grain"><feFuncA type="table" tableValues="0.55 1"/></feComponentTransfer>
    <feComposite in="d" in2="grain" operator="in"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="g2"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    <feComposite in="g2" in2="SourceGraphic" operator="in" result="tex"/>
    <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    <feDropShadow in="m" dx="0" dy="5" stdDeviation="3" flood-color="#141833" flood-opacity=".22"/>
  </filter>
</svg>
<div id="stage" data-composition-id="reel" data-start="0" data-width="1920" data-height="1080">
  <div class="clip" id="base" data-start="0" data-duration="{{TOTAL}}" data-track-index="0" style="position:absolute;inset:0">
    <div class="layer legacy">
      <div class="ground" id="ground"></div>
      <div id="scenes"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div id="fx"></div>
    <div class="layer top">
      <div class="chapters" id="chapters"></div>
      <div id="caps"></div>
      <div class="hoverlay" id="hoverlay"></div>
    </div>
  </div>
{{FRAMES}}
{{AUDIO}}
</div>
<script>window.REEL = {{SPEC}};</script>
<script src="gsap.min.js"></script>
{{LIBS}}
<script>
  // Shared kit for looks: DOM helpers and the role palette.
  window.KIT = {
    ROLE: { neutral: '#3b4bd8', changed: '#b7791f', added: '#1a7f37', removed: '#8c959f', flag: '#d6336c' },
    LIGHT: { neutral: '#6a78ff', changed: '#e0a24a', added: '#3fb35f', removed: '#b4bcc6', flag: '#f06292' },
    el: function (tag, cls, parent, text) {
      var e = document.createElement(tag); if (cls) e.className = cls;
      if (text != null) e.textContent = String(text).replace(/-/g, '‑');
      if (parent) parent.appendChild(e); return e;
    },
    svg: function (tag, attrs, parent) {
      var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e;
    },
    uid: (function () { var n = 0; return function (p) { n += 1; return (p || 'u') + n; }; })()
  };
</script>
<script src="art.js"></script>
<script src="look.js"></script>
{{OVERLAY}}
{{CUSTOM}}
<script>
(function () {
  var R = window.REEL, K = window.KIT, L = window.LOOK || {};
  var root = document.getElementById('scenes'), capRoot = document.getElementById('caps');
  var el = K.el, svgEl = K.svg, ROLE = K.ROLE;
  var TOTAL = parseFloat('{{TOTAL}}'), T = R.timing;
  var tl = gsap.timeline({ paused: true });
  var S3 = 'power3.out', IO = 'power3.inOut';
  K.tl = tl;
  [L.css, window.OVERLAY && window.OVERLAY.css].forEach(function (css) {
    if (!css) return;
    var roots = (css.match(/:root\s*\{[^}]*\}/g) || []).join(''), rest = css.replace(/:root\s*\{[^}]*\}/g, '');
    var st = document.createElement('style'); st.textContent = roots + '@scope (.layer) {' + rest + '}'; document.head.appendChild(st);
  });
  document.getElementById('stage').setAttribute('data-look', L.name || 'studio');
  if (L.ground) L.ground(document.getElementById('ground'), document.getElementById('overlay'), R);
  var roleColour = function (r) { return (L.role && L.role[r]) || ROLE[r] || ROLE.neutral; };
  var capInk = getComputedStyle(document.documentElement).getPropertyValue('--cap-ink').trim() || '#fff';

  // Pale chip colours get dark text so speaker names stay readable.
  function light(c) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(c).trim()); if (!m) return false;
    var n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > .6;
  }
  function spans(box, text, spaced) {
    return String(text).split(' ').map(function (w, i) { return el('span', null, box, (spaced && i ? ' ' : '') + w); });
  }
  // Karaoke caption: words light up as they are spoken (timings from the build), else in proportion to their length.
  function caption(who, colour, text, start, len, spoken) {
    var c = el('div', 'cap', capRoot);
    if (who) {
      var w = el('span', 'who', c, who), solid = String(colour).indexOf('var(') === 0
        ? getComputedStyle(document.documentElement).getPropertyValue(String(colour).slice(4, -1)).trim() : colour;
      w.style.background = solid; if (light(solid)) w.style.color = '#0b1530';
    }
    var line = el('span', 'line', c), words = spans(line, text, true);
    var weights = words.map(function (s) { return s.textContent.length + 2; });
    var sum = weights.reduce(function (a, b) { return a + b; }, 0), acc = 0, times = [];
    tl.fromTo(c, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .25, ease: S3 }, start - .12);
    words.forEach(function (s, i) { var at = spoken && spoken[i] ? spoken[i].start : start + len * .94 * (acc / sum); times.push({ word: s.textContent.trim(), at: at }); tl.to(s, { color: capInk, duration: .08 }, at); acc += weights[i]; });
    tl.to(c, { opacity: 0, duration: .18 }, start + len + .12);
    return times;
  }
  // Velocity-matched cuts (cut-the-curve) and zoom-throughs for changes of state.
  function cutOut(node, at) { tl.to(node, { x: -230, duration: .32, ease: 'power4.in' }, at - .32).to(node, { opacity: 0, duration: .2, ease: 'power1.in' }, at - .32); }
  function cutIn(node, at) { tl.fromTo(node, { x: 230, opacity: .35 }, { x: 0, opacity: 1, duration: .34, ease: 'power4.out' }, at); }
  function zoomIn(node, at, inverse) {
    tl.fromTo(node, { opacity: .15, scale: inverse ? 1.25 : .75, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .55, ease: 'expo.out' }, at);
  }
  function zoomOut(node, at) {
    tl.to(node, { scale: 1.2, filter: 'blur(10px)', duration: .2, ease: 'power3.in' }, at - .2)
      .to(node, { opacity: .15, duration: .2, ease: 'none' }, at - .2).set(node, { opacity: 0 }, at);
  }

  var chapters = document.getElementById('chapters');
  R.scenes.forEach(function (sc) {
    var seg = el('i', null, chapters), fill = el('b', null, seg);
    tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: sc.end - sc.start, ease: 'none' }, sc.start);
  });
  if (R.chapters === false) chapters.style.display = 'none';
  else tl.fromTo(chapters, { opacity: 0 }, { opacity: 1, duration: .4 }, Math.max(0, T.open - .2));

  // Transitions between any two scenes, built-in or frame (TRANSITIONS in build-reel.mjs). `a` leaves, `b` arrives;
  // the clip-based ones draw on whichever element is in front, so they work in both stacking orders.
  var fx = document.getElementById('fx'), ORDER = function (n) { return n.classList.contains('fw') ? 2 : 1; };
  function transition(kind, a, b, at, D) {
    var t0 = at - D / 2, bFront = ORDER(b) > ORDER(a) || (ORDER(b) === ORDER(a));
    if (ORDER(b) === ORDER(a)) { tl.set(a, { zIndex: 1 }, t0).set(b, { zIndex: 2 }, t0); }
    var front = bFront ? b : a, E = 'power3.inOut', clip = function (from, to) {
      if (bFront) tl.fromTo(b, { clipPath: from }, { clipPath: to, duration: D, ease: E }, t0).set(b, { clipPath: 'none' }, t0 + D);
      else tl.fromTo(a, { clipPath: to }, { clipPath: from, duration: D, ease: E, immediateRender: false }, t0).set(a, { clipPath: 'none' }, t0 + D);
    };
    if (kind === 'push' || kind === 'push-up') {
      var p = kind === 'push' ? 'xPercent' : 'yPercent', o1 = {}, o2 = {}, i1 = {}, i2 = {};
      o1[p] = 0; o2[p] = -100; i1[p] = 100; i2[p] = 0;
      o2.duration = i2.duration = D; o2.ease = i2.ease = E; o2.immediateRender = false;
      tl.fromTo(a, o1, o2, t0).fromTo(b, i1, i2, t0).set(a, { xPercent: 0, yPercent: 0 }, t0 + D);
    } else if (kind === 'blur') {
      tl.fromTo(a, { filter: 'blur(0px)', opacity: 1 }, { filter: 'blur(18px)', opacity: 0, duration: D, ease: 'power2.in', immediateRender: false }, t0)
        .fromTo(b, { filter: 'blur(18px)', opacity: 0 }, { filter: 'blur(0px)', opacity: 1, duration: D, ease: 'power2.out' }, t0);
    } else if (kind === 'zoom') {
      tl.fromTo(a, { scale: 1, filter: 'blur(0px)', opacity: 1 }, { scale: 1.35, filter: 'blur(12px)', opacity: 0, duration: D * .6, ease: 'power3.in', immediateRender: false }, t0)
        .fromTo(b, { scale: .82, filter: 'blur(12px)', opacity: 0 }, { scale: 1, filter: 'blur(0px)', opacity: 1, duration: D * .7, ease: 'expo.out' }, t0 + D * .3);
    } else if (kind === 'iris') clip('circle(0% at 50% 50%)', 'circle(75% at 50% 50%)');
    else if (kind === 'wipe') clip('inset(0 0 0 100%)', 'inset(0 0 0 0%)');
    else if (kind === 'blinds') {
      var N = 8, o = { p: 0 }, el2 = front, w = el2.offsetWidth || 1920, h = el2.offsetHeight || 1080;
      var shape = function (q) {
